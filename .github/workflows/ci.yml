name: CI

on:
  push:
    branches: [main, "migration/**"]
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # The integration tests create and drop their own throwaway databases.
      # mongo:7, not 8: MongoDB 8 refuses to start on the runners' Linux
      # kernel 6.19+ (SERVER-121912). The tests use nothing 8-specific.
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go test
        run: go test -race ./...
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017

  web:
    name: Next.js web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: TypeScript types match api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts || { echo "Run 'make api-types' and commit the result."; exit 1; }

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - run: npm run lint

      - name: Build
        run: npm run build
