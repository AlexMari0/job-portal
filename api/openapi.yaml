openapi: 3.1.0
info:
  title: Job Portal API
  version: 0.1.0
  description: |
    Go API for the job portal. Called only from the Next.js server
    (see docs/adr/0001-go-api-called-only-from-nextjs-server.md).
    Endpoints are added slice by slice as they are implemented.

paths:
  /health:
    get:
      operationId: getHealth
      summary: API and database health
      responses:
        "200":
          description: API and database are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /jobs:
    get:
      operationId: listJobs
      summary: All visible Jobs, newest first
      responses:
        "200":
          description: Visible Jobs (Hidden Jobs and Jobs without a Company are excluded)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }

  /jobs/{id}:
    get:
      operationId: getJob
      summary: One visible Job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: "Unknown, malformed, or Hidden Job (code: job_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /jobs/{id}/applications:
    post:
      operationId: applyToJob
      summary: Apply to a visible Job as the signed-in Candidate
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Application created with status Pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: "Candidate has no resume (code: resume_required)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "Unknown or Hidden Job (job_not_found), or Candidate not synced from Clerk yet (candidate_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Already applied to this Job (code: already_applied)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me:
    get:
      operationId: getMe
      summary: The signed-in Candidate
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: The Candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "Not synced from Clerk yet (code: candidate_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/applications:
    get:
      operationId: listMyApplications
      summary: The signed-in Candidate's Applications, newest first
      description: Includes Applications to Hidden Jobs; leaves out ones whose Job or Company was deleted.
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/resume:
    put:
      operationId: uploadResume
      summary: Upload or replace the signed-in Candidate's resume
      description: The previous file is kept in Cloudinary.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
                  description: PDF (detected from content), at most 2 MB
      responses:
        "200":
          description: Resume stored
          content:
            application/json:
              schema:
                type: object
                required: [resume]
                properties:
                  resume: { type: string, format: uri }
        "400":
          description: "Not a PDF, empty, missing, or over 2 MB (code: invalid_file, fields.resume)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: "Uploads not configured (code: uploads_not_configured)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies:
    post:
      operationId: registerCompany
      summary: Register a Company with a logo; signs it in
      description: |
        Validates text fields, then the logo, then that the email is free,
        and only then uploads the logo, so failed sign-ups leave no files.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, password, image]
              properties:
                name: { type: string }
                email: { type: string, format: email, description: Stored lowercased }
                password: { type: string, minLength: 6 }
                image:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP (detected from content), at most 1 MB
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySession" }
        "400":
          description: "Invalid text fields (validation_failed) or logo (invalid_file, fields.image)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Email already registered (code: email_taken)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Uploads or Company sign-in not configured"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/login:
    post:
      operationId: loginCompany
      summary: Sign a Company in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, description: Case-insensitive }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySession" }
        "400":
          description: "Body is not JSON (invalid_body) or fields missing (validation_failed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Wrong email or password, indistinguishable (code: invalid_credentials)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company:
    get:
      operationId: getCurrentCompany
      summary: The signed-in Company
      security: [{ companySession: [] }]
      responses:
        "200":
          description: The Company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /company/jobs:
    get:
      operationId: listCompanyJobs
      summary: All of the signed-in Company's Jobs (Hidden included), newest first
      security: [{ companySession: [] }]
      responses:
        "200":
          description: Jobs with their Application counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: createJob
      summary: Post a new (visible) Job
      security: [{ companySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewJob" }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyJob" }
        "400":
          description: "Invalid fields (code: validation_failed, see fields)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /company/jobs/{id}:
    patch:
      operationId: updateJobVisibility
      summary: Show or hide one of the Company's Jobs
      security: [{ companySession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visible]
              properties:
                visible: { type: boolean, description: The value to set (not a toggle) }
      responses:
        "200":
          description: Updated Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyJob" }
        "400":
          description: "visible missing (code: validation_failed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Job belongs to another Company (code: forbidden)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Unknown Job (code: job_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/applications:
    get:
      operationId: listCompanyApplications
      summary: Applications to the signed-in Company's Jobs, newest first
      description: Leaves out Applications whose Candidate or Job no longer exists.
      security: [{ companySession: [] }]
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyApplication" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /company/applications/{id}:
    patch:
      operationId: updateApplicationStatus
      summary: Set the status of an Application to one of the Company's Jobs
      security: [{ companySession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ApplicationStatus" }
      responses:
        "204": { description: Status updated }
        "400":
          description: "Unknown status (code: validation_failed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "Unknown, or another Company's, Application (code: application_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/clerk:
    post:
      operationId: clerkWebhook
      summary: Clerk user events (sent by Clerk via Svix, not by Next.js)
      description: |
        Verifies the Svix signature (svix-id, svix-timestamp, svix-signature
        headers) on the raw body. user.created and user.updated upsert the
        Candidate (resume untouched), user.deleted removes it, any other
        event is acknowledged and ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Event processed or ignored }
        "400":
          description: "Unreadable body or invalid signature (codes: invalid_body, invalid_signature)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Signing secret not configured (code: webhook_not_configured)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      description: Clerk session token of a Candidate, issued for WEB_ORIGIN (azp)

    companySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Company session token from POST /companies/login (HS256, 30 days)

  responses:
    Unauthenticated:
      description: "Missing or invalid session token (code: unauthenticated)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Candidate:
      type: object
      required: [id, name, email, image, resume]
      properties:
        id: { type: string, description: Clerk user id }
        name: { type: string }
        email: { type: string, format: email }
        image: { type: string, format: uri }
        resume:
          type: [string, "null"]
          format: uri
          description: Resume URL, null until the first upload

    CompanyProfile:
      type: object
      description: The signed-in Company's own view
      required: [id, name, email, image]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        image: { type: string, format: uri }

    CompanySession:
      type: object
      required: [token, expiresAt, company]
      properties:
        token: { type: string, description: 'Send as "Authorization: Bearer <token>"' }
        expiresAt: { type: string, format: date-time }
        company: { $ref: "#/components/schemas/CompanyProfile" }

    NewJob:
      type: object
      required: [title, description, location, category, level, salary]
      properties:
        title: { type: string, description: Trimmed; must not be empty }
        description: { type: string, description: Quill HTML; sanitized on write; must have visible text }
        location: { $ref: "#/components/schemas/Location" }
        category: { $ref: "#/components/schemas/Category" }
        level: { $ref: "#/components/schemas/Level" }
        salary: { type: integer, minimum: 0 }

    CompanyJob:
      type: object
      required: [id, title, location, category, level, salary, postedAt, visible, applicationCount]
      properties:
        id: { type: string }
        title: { type: string }
        location: { $ref: "#/components/schemas/Location" }
        category: { $ref: "#/components/schemas/Category" }
        level: { $ref: "#/components/schemas/Level" }
        salary: { type: integer, minimum: 0 }
        postedAt: { type: string, format: date-time }
        visible: { type: boolean }
        applicationCount: { type: integer, minimum: 0 }

    CompanyApplication:
      type: object
      required: [id, status, appliedAt, candidate, job]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        appliedAt: { type: string, format: date-time }
        candidate:
          type: object
          required: [id, name, image, resume]
          properties:
            id: { type: string }
            name: { type: string }
            image: { type: string, format: uri }
            resume: { type: [string, "null"], format: uri }
        job: { $ref: "#/components/schemas/JobSummary" }

    JobSummary:
      type: object
      required: [id, title, location, category, level, salary]
      properties:
        id: { type: string }
        title: { type: string }
        location: { $ref: "#/components/schemas/Location" }
        category: { $ref: "#/components/schemas/Category" }
        level: { $ref: "#/components/schemas/Level" }
        salary: { type: integer, minimum: 0 }

    ApplicationStatus:
      type: string
      enum: [Pending, Accepted, Rejected]

    Application:
      type: object
      required: [id, status, appliedAt, job, company]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        appliedAt: { type: string, format: date-time }
        job: { $ref: "#/components/schemas/JobSummary" }
        company: { $ref: "#/components/schemas/CompanySummary" }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }

    Location:
      type: string
      enum: [Bangalore, Washington, Hyderabad, Mumbai, California, Chennai, New York]

    Category:
      type: string
      enum: [Programming, Data Science, Designing, Networking, Management, Marketing, Cybersecurity]

    Level:
      type: string
      enum: [Beginner level, Intermediate level, Senior level]

    CompanySummary:
      type: object
      description: Public view of a Company
      required: [id, name, image]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string, format: uri }

    Job:
      type: object
      required: [id, title, description, excerpt, location, category, level, salary, postedAt, company]
      properties:
        id: { type: string }
        title: { type: string }
        description:
          type: string
          description: Sanitized HTML from the Quill editor
        excerpt:
          type: string
          description: Plain-text preview, at most 150 characters
        location: { $ref: "#/components/schemas/Location" }
        category: { $ref: "#/components/schemas/Category" }
        level: { $ref: "#/components/schemas/Level" }
        salary: { type: integer, minimum: 0 }
        postedAt: { type: string, format: date-time }
        company: { $ref: "#/components/schemas/CompanySummary" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "snake_case machine-readable code" }
            message: { type: string }
            fields:
              type: object
              description: Per-field validation messages (400 only)
              additionalProperties: { type: string }
