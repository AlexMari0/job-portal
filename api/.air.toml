# Hot reload for local development: `go tool air` (run via `make api`).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  delay = 500

[misc]
  clean_on_exit = true
